name: PR SLA smoke test

# MINIMAL test: does a Slack message fire?
# - Uses a Slack Incoming Webhook (simplest; one secret).
# - SLA = 0 hours, so ANY open non-draft PR counts as breached immediately.
#
# SETUP:
#   1. Slack: create Incoming Webhook -> copy URL.
#   2. Repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret: name SLACK_WEBHOOK_URL, value = the URL.
#   3. Put this file at .github/workflows/pr-sla-smoketest.yml, commit to main.
#   4. Open a PR (branch -> edit README -> open PR vs main).
#   5. Actions tab -> "PR SLA smoke test" -> Run workflow.
#   6. Watch your Slack channel. Then delete this file / raise the SLA.

on:
  workflow_dispatch:            # manual "Run workflow" button
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pull-requests: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const SLA = 0;   // hours -> everything is "breached"
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const now = Date.now();
            const lines = [];
            for (const pr of prs) {
              if (pr.draft) continue;
              const ageH = (now - new Date(pr.created_at).getTime()) / 3600000;
              if (ageH >= SLA) {
                lines.push(`🔴 <${pr.html_url}|#${pr.number} ${pr.title}> open ${ageH.toFixed(1)}h (SLA ${SLA}h)`);
              }
            }
            core.info(`Open PRs: ${prs.length}; alerts: ${lines.length}`);
            if (!lines.length) { core.info("No open PRs to alert on — open a PR first."); return; }
            const url = process.env.SLACK_WEBHOOK_URL;
            if (!url) { core.setFailed("SLACK_WEBHOOK_URL secret is not set."); return; }
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: `*PR SLA smoke test* — ${lines.length} alert(s)\n` + lines.join("\n") }),
            });
            core.info(`Slack responded: ${res.status}`);
